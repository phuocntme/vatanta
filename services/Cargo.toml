[workspace]
resolver = "2"
members = ["common", "relayer", "indexer"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["phuocntme"]
repository = "https://github.com/phuocntme/vatanta"

[workspace.dependencies]
alloy = { version = "2.5.0", features = ["full"] }
anyhow = "1.0.104"
axum = "0.8.9"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
ruint = "1.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vatanta-common = { path = "common" }
