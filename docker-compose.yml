# Vatanta off-chain stack. Works on Coolify; expose `web`, `relayer`, `indexer` through Cloudflare
# Tunnel (profile "tunnel"). Fill .env from .env.example first. Contracts must already be deployed
# (contracts/deployments/$NETWORK.json is mounted read-only).
name: vatanta # explicit project name for containers and volumes
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vatanta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vatanta}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vatanta"]
      interval: 5s
      retries: 10

  indexer:
    build: { context: ., dockerfile: services/Dockerfile }
    command: vatanta-indexer
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://vatanta:${POSTGRES_PASSWORD:-vatanta}@postgres/vatanta_indexer
      DEPLOYMENT: /deployments/${NETWORK:-fuji}.json
      L1_RPC: ${L1_RPC}
      C_RPC: ${C_RPC}
      BIND: 0.0.0.0:8081
    volumes: ["./contracts/deployments:/deployments:ro"]
    ports: ["${BIND_HOST:-127.0.0.1}:${INDEXER_PORT:-8081}:8081"]
    restart: unless-stopped

  relayer:
    build: { context: ., dockerfile: services/Dockerfile }
    command: vatanta-relayer
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://vatanta:${POSTGRES_PASSWORD:-vatanta}@postgres/vatanta_relayer
      DEPLOYMENT: /deployments/${NETWORK:-fuji}.json
      RELAYER_PK: ${RELAYER_PK}
      L1_RPC: ${L1_RPC}
      C_RPC: ${C_RPC}
      BATCH_INTERVAL_SECS: ${BATCH_INTERVAL_SECS:-600}
      FAUCET: ${FAUCET:-0}
      BIND: 0.0.0.0:8080
    volumes: ["./contracts/deployments:/deployments:ro"]
    ports: ["${BIND_HOST:-127.0.0.1}:${RELAYER_PORT:-8080}:8080"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_NETWORK: ${NETWORK:-fuji}
        NEXT_PUBLIC_RELAYER_URL: ${PUBLIC_RELAYER_URL}
        NEXT_PUBLIC_INDEXER_URL: ${PUBLIC_INDEXER_URL}
        NEXT_PUBLIC_L1_RPC: ${PUBLIC_L1_RPC}
        NEXT_PUBLIC_C_RPC: ${PUBLIC_C_RPC}
        NEXT_PUBLIC_PRIVY_APP_ID: ${PRIVY_APP_ID}
        NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:-}
    ports: ["${BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:4001"]
    restart: unless-stopped

  # ava-labs ICM relayer (self-hosted). Config: l1/fuji/icm-relayer.json (generated by l1/fuji/icm-relayer-config.sh).
  icm-relayer:
    image: avaplatform/icm-relayer:${ICM_RELAYER_VERSION:-v1.8.4} # ≥ v1.8 for Fuji after Helicon (avalanchego 1.15)
    command: ["--config-file", "/config/icm-relayer.json"]
    volumes: ["./l1/fuji:/config:ro", "icmdb:/icm-relayer-db"]
    depends_on: [c-rpc]
    restart: unless-stopped
    profiles: ["icm"]

  # C-Chain RPC for icm-relayer combining several public endpoints (failover, and eth_getLogs split
  # into ≤ 100-block chunks where an endpoint caps the range). l1/fuji/rpc-failover.py
  c-rpc:
    image: python:3.13-alpine
    command: ["python3", "-I", "/app/rpc-failover.py"]
    environment:
      C_RPC_UPSTREAMS: ${C_RPC_UPSTREAMS:-https://avalanche-fuji-c-chain-rpc.publicnode.com,https://api.avax-test.network/ext/bc/C/rpc,https://avalanche-fuji.drpc.org}
      MAX_LOG_RANGE: "100"
    volumes: ["./l1/fuji/rpc-failover.py:/app/rpc-failover.py:ro"]
    restart: unless-stopped
    profiles: ["icm"]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment: { TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}" }
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  pgdata:
  icmdb:
