[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ignored_warnings_from = ["lib", "src/verifiers"]
ignored_error_codes = [6335, 2018, 5667, 2072]
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "poseidon2-evm/=lib/poseidon2-evm/",
  "@openzeppelin/contracts@5.0.2/=lib/icm-contracts/lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable@5.0.2/=lib/icm-contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
  "@avalabs/subnet-evm-contracts@1.2.2/=lib/icm-contracts/lib/subnet-evm/contracts/",
  "@teleporter/=lib/icm-contracts/contracts/teleporter/",
  "@utilities/=lib/icm-contracts/contracts/utilities/",
  "@mocks/=lib/icm-contracts/contracts/mocks/",
  "@ictt/=lib/icm-contracts/contracts/ictt/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.ci.invariant]
runs = 256
depth = 64

[lint]
lint_on_build = false
